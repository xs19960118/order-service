    template:
      default-topic: boss-service-topic
# MyBatis Plus 全局配置（多数据源配置已在各自的 MyBatisConfig 中定义）
# 注意：多数据源模式下，不需要在这里配置 mapper-locations 和 type-aliases-package
# 每个数据源的配置在对应的 MyBatisConfig 类中独立配置
mybatis-plus:
  # 全局配置
  global-config:
    banner: false  # 关闭 MyBatis Plus 启动 banner
    db-config:
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 通用配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    root: INFO
    com.xs.boss.infrastructure.persistence.mapper: DEBUG
server:
  port: 8088
# redis cluster & kafka cluster configured

# JWT 配置
jwt:
  secret: LO5MJI7re0TrFKjJY80QJYntsYgEDOOY
  algo: HS256
  expire: 28800  # Token 过期时间：8小时（单位：秒）
  header: Authorization
  prefix: "Bearer "

# xsbox starter 配置（不用改）
xsbox:
  enabled: true
  app-name: Boss
  
  # JWT 配置（可根据项目需要覆盖）
  jwt:
    secret: boss-jwt-secret-key-please-change-in-production-min-32-chars
    expiration: 86400000  # Token 过期时间：24小时（单位：毫秒）
    token-prefix: "Bearer "  # Token 前缀
    token-header: "Authorization"  # Token 请求头名称
  
  # MyBatis Plus 配置（可选，有默认值）
  mybatis:
    enabled: true
    max-limit: 1000  # 最大查询条数限制
    performance-enabled: false  # 是否开启性能分析
    logic-delete-field: "deleted"  # 逻辑删除字段名
    logic-not-delete-value: 0  # 未删除值
    logic-delete-value: 1  # 已删除值
  
  # Redis 配置（可选，有默认值）
  redis:
    key-prefix: "boss_"  # Redis key 前缀
    default-expire: 3600  # 默认过期时间（单位：秒）
  
  # Excel 配置（可选，有默认值）
  excel:
    max-rows: 100000  # 最大导出行数
    default-sheet-name: "Sheet1"  # 默认 Sheet 名称
    cache-enabled: true  # 是否启用缓存

# knife4j 的增强配置
knife4j:
  # 是否开启增强功能
  enable: true
  # 自定义文档配置
  documents:
    - group: Boss服务
      name: "📋 项目说明"
      locations: classpath:docs/项目说明/*
    - group: Boss服务
      name: "🏗️ 架构设计"
      locations: classpath:docs/架构设计/*
    - group: Boss服务
      name: "📚 其它文档"
      locations: classpath:docs/其它文档/*
  setting:
    language: zh-CN
    enable-home-custom: true
    enable-document-manage: true
    # 注意：Knife4j 4.4.0 的 group-order 配置不生效
    # 分组排序通过 Knife4jConfig 中 Bean 方法名的字母顺序控制（a01, a02, a03...）
  basic:
