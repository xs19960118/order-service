plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.xs'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5"
        }
        dependencies {
            // 第三方依赖版本管理
            // 注意：以下依赖可能已包含在 xsbox-spring-boot-starter 中，此处保留版本管理以确保版本一致性
            dependency 'org.projectlombok:lombok:1.18.30'
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
            dependency 'com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.4.0'
            dependency 'com.mysql:mysql-connector-j:8.0.33'
            dependency 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'
            dependency 'org.aspectj:aspectjrt:1.9.20.1'
            dependency 'org.aspectj:aspectjweaver:1.9.20.1'
            dependency 'io.swagger.core.v3:swagger-models-jakarta:2.2.19'
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
    }
}
