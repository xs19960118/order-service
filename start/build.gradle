plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':order-service-interfaces')

    // 自定义 Starter（已包含 spring-boot-starter-web, mybatis-plus 等常用依赖）
    implementation 'com.xs.xsbox:xsbox-spring-boot-starter:1.0.0'

    // 开发工具
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    mainClass = 'com.xs.order.OrderServiceApplication'
}

processResources {
    filesMatching(['**/*.yml', '**/*.properties', '**/*.md']) {
        expand(project.properties)
    }
}
