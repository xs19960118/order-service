spring:
  application:
    name: order-service
  profiles:
    active: dev
  
  # 禁用 Spring Security 自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  
  # DevTools 配置（热更新）
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

  datasource:
    url: jdbc:mysql://rm-uf639588047126dlb.mysql.rds.aliyuncs.com:3306/fom_sit?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: fom_sit
    password: w1aVKzdmXKZEbJjE
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: r-uf6jgm7mhg9bpfcrql.redis.rds.aliyuncs.com
      port: 6379
      password: crm_nonpro:R4QbjTrK5UyZPKpU
      database: 17
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 2000ms
  kafka:
    bootstrap-servers: kafka.sit.eainc.com:9092
    client-id: order-service-client
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      compression-type: lz4
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false
    admin:
      fail-fast: true
    template:
      default-topic: order-service-test
mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.xs.order.service.domain.model
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    root: INFO
    com.xs.order.service.infrastructure.persistence.mapper: DEBUG
server:
  port: 8088
# redis cluster & kafka cluster configured

# xsbox starter 配置
xsbox:
  enabled: true
  app-name: Order Service
  
  # JWT 配置（可根据项目需要覆盖）
  jwt:
    secret: order-service-jwt-secret-key-please-change-in-production-min-32-chars
    expiration: 86400000  # Token 过期时间：24小时（单位：毫秒）
    token-prefix: "Bearer "  # Token 前缀
    token-header: "Authorization"  # Token 请求头名称
  
  # MyBatis Plus 配置（可选，有默认值）
  mybatis:
    enabled: true
    max-limit: 1000  # 最大查询条数限制
    performance-enabled: false  # 是否开启性能分析
    logic-delete-field: "deleted"  # 逻辑删除字段名
    logic-not-delete-value: 0  # 未删除值
    logic-delete-value: 1  # 已删除值
  
  # Redis 配置（可选，有默认值）
  redis:
    key-prefix: "order:"  # Redis key 前缀
    default-expire: 3600  # 默认过期时间（单位：秒）
  
  # Excel 配置（可选，有默认值）
  excel:
    max-rows: 100000  # 最大导出行数
    default-sheet-name: "Sheet1"  # 默认 Sheet 名称
    cache-enabled: true  # 是否启用缓存

# knife4j 的增强配置
knife4j:
  # 是否开启增强功能
  enable: true
  # 自定义文档配置
  documents:
    - group: 订单服务
      name: "📂 项目文档 » 项目说明"
      locations: classpath*:docs/项目说明/*
    - group: 订单服务
      name: "📂 项目文档 » 架构设计"
      locations: classpath*:docs/架构设计/*
    - group: 订单服务
      name: "📂 开发文档 » API规范"
      locations: classpath*:docs/api/*
    - group: 订单服务
      name: "📂 开发文档 » 部署指南"
      locations: classpath*:docs/deploy/*
    - group: 订单服务
      name: "📂 其他文档 » 注意事项"
      locations: classpath*:docs/其它文档/*
  setting:
    language: zh-CN
    enable-home-custom: true
    enable-document-manage: true
  basic:
    # 访问 /doc.html 需要用户名+密码
    enable: true
    # 访问 /doc.html 的用户名
    username: test
    # 密码 /doc.html 的密码
    password: 123456