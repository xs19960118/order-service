      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 2000ms

  kafka:
    bootstrap-servers: kafka.sit.eainc.com:9092
    client-id: order-service-client
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      compression-type: lz4
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false
    admin:
      fail-fast: true
    template:
      default-topic: order-service-test

mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.xs.order.service.domain.model
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.xs.order.service.infrastructure.persistence.mapper: DEBUG

server:
  port: 8080
